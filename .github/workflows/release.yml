name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    name: Package checksummed release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0

      - name: Install dependencies
        run: npm ci

      - name: Audit production Node dependencies
        run: npm audit --omit=dev

      # This gate is repeated on the tag so a candidate cannot rely on a PR
      # scan from a different commit. The exact locked tool supports Rust 1.88.
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        run: cargo audit --file crates/Cargo.lock

      - name: Validate product version and release tag
        run: scripts/package-release.sh "${GITHUB_REF_NAME}" --check

      - name: Build deploy artifacts
        run: npm run build:deploy

      - name: Package checksummed Linux artifacts
        run: scripts/package-release.sh "${GITHUB_REF_NAME}"

      - name: Build release-candidate image
        run: docker build -t dockermap:release-candidate .

      - name: Generate release image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: dockermap:release-candidate
          format: spdx-json
          output-file: dist/release/dockermap-${{ github.ref_name }}-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Report all release-candidate image vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: dockermap:release-candidate
          fail-build: false
          severity-cutoff: negligible
          only-fixed: false
          output-format: sarif
          output-file: dist/release/dockermap-${{ github.ref_name }}-image.grype.all.sarif

      - name: Gate remediable high and critical release-candidate image vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: dockermap:release-candidate
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: sarif
          output-file: dist/release/dockermap-${{ github.ref_name }}-image.grype.gating.sarif

      - name: Generate release artifact SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist/release/dockermap-${{ github.ref_name }}-linux-x86_64
          format: spdx-json
          output-file: dist/release/dockermap-${{ github.ref_name }}-linux-x86_64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload release-candidate artifacts for maintainer review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ github.ref_name }}-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30
