name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    name: Package signed-source baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Install dependencies
        run: npm ci

      - name: Build deploy artifacts
        run: npm run build:deploy

      - name: Package checksummed Linux artifacts
        run: scripts/package-release.sh "${GITHUB_REF_NAME}"

      - name: Create GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            --title "DockerMap ${GITHUB_REF_NAME}" \
            dist/release/*.tar.gz dist/release/*.sha256
