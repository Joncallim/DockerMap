name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  web-and-api:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check product version authority
        run: npm run check:version

      - name: Audit dependencies
        run: npm audit --omit=dev

      - name: Check generated contracts
        run: npm run check:contracts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Round-11 (F7): the deploy artifact build (VITE_API_BASE_URL="") is the
      # exact path where the R7 base-URL bug lived; verify it on every PR.
      - name: Setup Rust (deploy build)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Test product version authority
        run: npm run test:version

      - name: Build deploy artifact
        run: npm run build:deploy

      - name: Test
        run: npm run test:js

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --manifest-path crates/Cargo.toml --all -- --check

      - name: Lint
        run: cargo clippy --manifest-path crates/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path crates/Cargo.toml

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run GUI smoke tests
        run: npm run test:e2e

      - name: Upload Playwright and axe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-axe-${{ github.sha }}
          path: |
            test-artifacts/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  production-image-e2e:
    name: Production image E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      # This is intentionally separate from the image curl smoke below: it
      # exercises nginx, browser auth, live labeled Docker inventory, and the
      # two-client rate-limit regression inside the built production image.
      - name: Run production-image browser tests
        run: DOCKERMAP_E2E_PRODUCTION_IMAGE=1 npx playwright test --config tests/e2e/playwright.config.ts --grep @production-image

  docker-image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The runtime stage copies the pruned workspace dependency closure from
      # the resolver's root. Build on every PR so hoisting or closure drift
      # cannot ship unnoticed.
      - name: Build image
        run: docker build -t dockermap:ci .

      - name: Assert runtime dependency boundary
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh dockermap:ci -ec '
            ! command -v npm
            ! command -v npx
            test ! -e /opt/dockermap/node_modules/.bin/tsx
            test ! -e /opt/dockermap/node_modules/.bin/vite
            test ! -d /opt/dockermap/node_modules/typescript
            test ! -e /opt/dockermap/node_modules/@playwright/test/package.json
            node -e "import(\"express\").then(() => import(\"@dockermap/contracts\"))"
          '

      - name: Smoke-test runtime image
        run: |
          set -euo pipefail
          docker run -d --name dockermap-smoke -p 127.0.0.1:3999:3233 dockermap:ci
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3999/api/health; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs dockermap-smoke
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:3999/api/snapshot
          for attempt in {1..60}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' dockermap-smoke)" = healthy ]; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker inspect dockermap-smoke
              docker logs dockermap-smoke
              exit 1
            fi
            sleep 1
          done
          if docker logs dockermap-smoke 2>&1 | grep --quiet 'ERR_MODULE_NOT_FOUND'; then
            docker logs dockermap-smoke
            exit 1
          fi

      - name: Remove smoke-test container
        if: always()
        run: docker rm -f dockermap-smoke || true
