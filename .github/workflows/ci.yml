name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  web-and-api:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --omit=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Round-11 (F7): the deploy artifact build (VITE_API_BASE_URL="") is the
      # exact path where the R7 base-URL bug lived; verify it on every PR.
      - name: Setup Rust (deploy build)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Build deploy artifact
        run: npm run build:deploy

      - name: Test
        run: npm run test:js

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --manifest-path crates/Cargo.toml --all -- --check

      - name: Lint
        run: cargo clippy --manifest-path crates/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path crates/Cargo.toml

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run GUI smoke tests
        run: npm run test:e2e

  docker-image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Issue #42: the runtime stage must mirror the lockfile's nested
      # workspace layout (apps/api/node_modules) or the API cannot resolve
      # express. Build the image on every PR so regressions ship nowhere.
      - name: Build image
        run: docker build -t dockermap:ci .

      - name: Smoke-test runtime image
        run: |
          set -euo pipefail
          docker run -d --name dockermap-smoke -p 127.0.0.1:3999:3233 dockermap:ci
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3999/api/health; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs dockermap-smoke
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:3999/api/snapshot
          if docker logs dockermap-smoke 2>&1 | grep --quiet 'ERR_MODULE_NOT_FOUND'; then
            docker logs dockermap-smoke
            exit 1
          fi

      - name: Remove smoke-test container
        if: always()
        run: docker rm -f dockermap-smoke || true
