name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# CI builds, tests, and retains evidence; it does not need repository write
# access or a package/container publication token.
permissions:
  contents: read

jobs:
  web-and-api:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.2.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check product version authority
        run: npm run check:version

      - name: Audit dependencies
        run: npm audit --omit=dev

      - name: Check generated contracts
        run: npm run check:contracts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test deployment and supply-chain policies
        run: npm run test:deployment

      # Round-11 (F7): the deploy artifact build (VITE_API_BASE_URL="") is the
      # exact path where the R7 base-URL bug lived; verify it on every PR.
      - name: Setup Rust (deploy build)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0

      - name: Test product version authority
        run: npm run test:version

      - name: Build deploy artifact
        run: npm run build:deploy

      - name: Test
        run: npm run test:js

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --manifest-path crates/Cargo.toml --all -- --check

      - name: Lint
        run: cargo clippy --manifest-path crates/Cargo.toml --all-targets -- -D warnings

      # RustSec advisories are a release gate. A future exception must name a
      # specific advisory and be documented in docs/release/SUPPLY_CHAIN.md.
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: crates

      - name: Test
        run: cargo test --manifest-path crates/Cargo.toml

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.2.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run GUI smoke tests
        run: npm run test:e2e

      - name: Upload Playwright and axe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-axe-${{ github.sha }}
          path: |
            test-artifacts/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  production-image-e2e:
    name: Production image E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.2.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      # This is intentionally separate from the image curl smoke below: it
      # exercises nginx, browser auth, live labeled Docker inventory, and the
      # two-client rate-limit regression inside the built production image.
      - name: Run production-image browser tests
        run: DOCKERMAP_E2E_PRODUCTION_IMAGE=1 npx playwright test --config tests/e2e/playwright.config.ts --grep @production-image

  docker-image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0

      # Issue #42: the runtime stage must mirror the lockfile's nested
      # workspace layout (apps/api/node_modules) or the API cannot resolve
      # express. Build the image on every PR so regressions ship nowhere.
      - name: Build image
        run: docker build -t dockermap:ci .

      # Keep a reviewable inventory of the exact locally built image. The
      # artifact is intentionally not uploaded to a registry.
      - name: Generate image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: dockermap:ci
          format: spdx-json
          output-file: artifacts/dockermap-ci.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # The complete report is retained, including lower-severity and unfixed
      # findings. The next step is the deliberately narrower release gate.
      - name: Report all image vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: dockermap:ci
          fail-build: false
          severity-cutoff: negligible
          only-fixed: false
          output-format: sarif
          output-file: artifacts/dockermap-ci.grype.all.sarif

      # High and critical vulnerabilities with an available fix fail CI; the
      # complete report above remains available for triage.
      - name: Gate remediable high and critical image vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: dockermap:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: sarif
          output-file: artifacts/dockermap-ci.grype.gating.sarif

      - name: Upload image supply-chain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-supply-chain-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Smoke-test runtime image
        run: |
          set -euo pipefail
          docker run -d --name dockermap-smoke -p 127.0.0.1:3999:3233 dockermap:ci
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3999/api/health; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs dockermap-smoke
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:3999/api/snapshot
          for attempt in {1..60}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' dockermap-smoke)" = healthy ]; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker inspect dockermap-smoke
              docker logs dockermap-smoke
              exit 1
            fi
            sleep 1
          done
          if docker logs dockermap-smoke 2>&1 | grep --quiet 'ERR_MODULE_NOT_FOUND'; then
            docker logs dockermap-smoke
            exit 1
          fi

      - name: Remove smoke-test container
        if: always()
        run: docker rm -f dockermap-smoke || true
