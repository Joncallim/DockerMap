# Sanitized reverse-proxy configuration sample (parser/redaction fixture)
server {
    listen 80;
    server_name example.test;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "Bearer DOCKERMAP_TEST_FAKE_NGINX_TOKEN";
    }
}

server {
    listen 443 ssl;
    server_name internal.example.test;

    ssl_certificate /etc/nginx/ssl/internal.crt;
    ssl_certificate_key /etc/nginx/ssl/internal.key;

    location /app {
        proxy_pass http://127.0.0.1:8080;
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }
}
