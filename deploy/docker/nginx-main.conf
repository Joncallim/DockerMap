worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;

  # The container-facing hop is HTTP even when a trusted outer proxy
  # terminated TLS. Preserve that fact only for the one closed value the API
  # understands; missing, malformed, appended, or other values fall back to
  # this hop's actual scheme instead of being reflected downstream.
  map $http_x_forwarded_proto $dockermap_forwarded_proto {
    ~^https$ https;
    default $scheme;
  }

  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;
  include /etc/nginx/sites-enabled/*;
}
