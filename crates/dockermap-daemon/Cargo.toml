[package]
name = "dockermap-daemon"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "dockermap-daemon"
path = "src/main.rs"

[dependencies]
axum = "0.8"
bollard = "0.19"
dockermap-core = { path = "../dockermap-core" }
futures-util = "0.3"
getrandom = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
