[package]
name = "dockermap-core"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "=1.2.1"
sha2 = "0.11.0"
yaml_serde = "0.10"

[dev-dependencies]
jsonschema = { version = "=0.52.1", default-features = false, features = ["arbitrary-precision"] }
tempfile = "3"
